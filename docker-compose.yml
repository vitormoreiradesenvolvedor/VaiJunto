services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php
    networks:
      - vaijunto

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      - mysql
      - redis
    networks:
      - vaijunto

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vaijunto}
      MYSQL_USER: ${DB_USERNAME:-vaijunto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - vaijunto

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - vaijunto

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - vaijunto

  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/html
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    networks:
      - vaijunto

volumes:
  mysql_data:
  redis_data:

networks:
  vaijunto:
    driver: bridge
